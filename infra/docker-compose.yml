services:
  db:
    image: postgres:16
    container_name: teleestomato_db
    environment:
      POSTGRES_USER: teleestomato
      POSTGRES_PASSWORD: teleestomato123
      POSTGRES_DB: teleestomato
    ports:
      - "5432:5432"
    volumes:
      - teleestomato_pgdata:/var/lib/postgresql/data

volumes:
  teleestomato_pgdata:
